spring:
  application:
    name: studyforge-backend

  datasource:
    # In Docker, DB_HOST=db (vezi docker-compose.yml). Local (IntelliJ) ramane localhost.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:studyforge}
    username: ${POSTGRES_USER:studyforge}
    password: ${POSTGRES_PASSWORD:studyforge}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Tabelele sunt gestionate exclusiv de Flyway
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

studyforge:
  # Fusul orar folosit pentru "azi" si pentru datele din plan
  zone: ${APP_TIMEZONE:Europe/Bucharest}
  # Cat text din PDF-ul incarcat trimitem maxim la Gemini
  max-input-chars: 150000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout: 180s
    max-retries: 2
  jwt:
    # Cheie lunga si aleatorie (minim 32 de caractere). Pune-o in .env ca JWT_SECRET.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:7d}
